{% extends "base.html" %} {% block title %}Sign in - Zeptodo{% endblock %}
{% block heading %}
<h1 class="text-4xl font-light tracking-tight">Sign in</h1>
{% endblock %}
{% block content %}
<section class="max-w-sm mx-auto">
	{% match error %} {% when Some with (msg) %}
	<div id="login-error" role="alert" class="alert alert-error mb-4">
		<span>{{ msg }}</span>
	</div>
	{% when None %} {% endmatch %}
	<form method="post" action="/login" class="flex flex-col gap-4" novalidate>
		<input type="hidden" name="_csrf" value="{{ layout.csrf_token }}" />
		<label class="form-control w-full">
			<span class="label-text" id="username-label">Username</span>
			<input
				type="text"
				name="username"
				required
				autocomplete="username"
				maxlength="64"
				value="{{ username }}"
				aria-labelledby="username-label"
				{% match error %}{% when Some with (_) %}aria-invalid="true" aria-describedby="login-error"{% when None %}{% endmatch %}
				class="input input-bordered w-full"
			/>
		</label>
		<label class="form-control w-full">
			<span class="label-text" id="password-label">Password</span>
			<input
				type="password"
				name="password"
				required
				autocomplete="current-password"
				aria-labelledby="password-label"
				{% match error %}{% when Some with (_) %}aria-invalid="true" aria-describedby="login-error"{% when None %}{% endmatch %}
				class="input input-bordered w-full"
			/>
		</label>
		<button type="submit" class="btn btn-primary w-full font-normal">Sign in</button>
	</form>
</section>
{% endblock %}
