{% extends "base.html" %} {% block title %}Tasks - Zeptodo{% endblock %}
{% block heading %}
{% match layout.username %} {% when Some with (name) %}
<h1 class="text-4xl font-light tracking-tight capitalize">{{ name }}'s tasks</h1>
{% when None %}
<h1 class="text-4xl font-light tracking-tight">Tasks</h1>
{% endmatch %}
{% endblock %}
{% block content %}
<section class="max-w-2xl mx-auto space-y-4">
	<form
		method="post"
		action="/tasks"
		hx-post="/tasks"
		hx-target="#task-list"
		hx-swap="outerHTML"
		hx-on::after-request="if(event.detail.successful) { this.reset(); expanded = false; }"
		x-data="{ expanded: false }"
		class=""
	>
		<input type="hidden" name="_csrf" value="{{ csrf_token }}" />
		<div class="flex items-center gap-2">
			<input
				type="text"
				name="title"
				required
				maxlength="128"
				placeholder="Add a task..."
				class="flex-1 bg-transparent border-0 border-b-2 border-base-300 rounded-none px-0 py-2 focus:outline-none focus:border-primary transition-colors"
			/>
			<button
				type="button"
				@click="expanded = !expanded"
				class="btn btn-ghost btn-sm btn-circle opacity-60 hover:opacity-100"
				:aria-label="expanded ? 'Hide description' : 'Add description'"
				:aria-expanded="expanded"
			>
				<svg
					xmlns="http://www.w3.org/2000/svg"
					class="size-4"
					viewBox="0 0 24 24"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round"
					aria-hidden="true"
					x-show="!expanded"
				>
					<line x1="12" y1="5" x2="12" y2="19"></line>
					<line x1="5" y1="12" x2="19" y2="12"></line>
				</svg>
				<svg
					xmlns="http://www.w3.org/2000/svg"
					class="size-4"
					viewBox="0 0 24 24"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
					stroke-linecap="round"
					stroke-linejoin="round"
					aria-hidden="true"
					x-show="expanded"
					x-cloak
				>
					<line x1="5" y1="12" x2="19" y2="12"></line>
				</svg>
			</button>
			<button type="submit" class="btn btn-primary btn-outline btn-sm font-normal uppercase">Save</button>
		</div>
		<textarea
			x-show="expanded"
			x-cloak
			x-transition.opacity.duration.150ms
			name="description"
			rows="2"
			maxlength="16384"
			placeholder="Description (optional)"
			class="w-full mt-2 bg-transparent border-0 border-b-2 border-base-300 rounded-none px-0 py-2 focus:outline-none focus:border-primary transition-colors resize-y"
		></textarea>
	</form>
	<div class="flex justify-end items-center">
	<form
		method="post"
		action="/tasks/show-terminal"
		hx-post="/tasks/show-terminal"
		hx-target="#task-list"
		hx-swap="outerHTML"
		class="contents"
	>
		<input type="hidden" name="_csrf" value="{{ csrf_token }}" />
		<button
			type="submit"
			class="btn btn-ghost btn-xs text-xs uppercase tracking-wider opacity-60 hover:opacity-100 font-normal"
		>
			{% if show_terminal %}Hide done and cancelled{% else %}Show done and cancelled{% endif %}
		</button>
	</form>
	</div>

	{% include "_task_list.html" %}

	<div
		id="reorder-live"
		role="status"
		aria-live="polite"
		class="sr-only"
	></div>
</section>
{% endblock %}
