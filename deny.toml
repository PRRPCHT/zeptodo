# cargo-deny configuration for Zeptodo
# https://embarkstudios.github.io/cargo-deny/

# ============================================================================
# Licenses
# ============================================================================
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
    "NCSA",
    "CDLA-Permissive-2.0",
]

confidence-threshold = 0.8

exceptions = [
    # Add any specific crate exceptions here if needed
    # { allow = ["SOME-LICENSE"], name = "crate-name" },
]

# ============================================================================
# Security Advisories
# ============================================================================
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

yanked = "warn"

ignore = [
    # RUSTSEC-2023-0071: Marvin Attack timing sidechannel in `rsa`.
    "RUSTSEC-2023-0071",
]

unmaintained = "all"

# ============================================================================
# Banned Dependencies
# ============================================================================
[bans]
multiple-versions = "warn"
wildcards = "allow"

skip = [
    # Add crates here that are OK to have multiple versions
]

deny = [
    # Add any crates you want to ban here
]

# ============================================================================
# Sources
# ============================================================================
[sources]
unknown-registry = "deny"
unknown-git = "warn"

allow-git = [
    # Add any allowed git sources here
]
